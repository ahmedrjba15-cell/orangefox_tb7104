name: TWRP Build TB7104-32BIT-FINAL

on:
  workflow_dispatch:

jobs:
  build:
    # استخدام 20.04 لأنها الأفضل لبناء أندرويد 8 و 9 للـ 32 بت
    runs-on: ubuntu-20.04 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools (The 32-bit Foundation)
        run: |
          sudo apt update
          # تثبيت بايثون 2 الأساسي (مستقر جداً في 20.04)
          sudo apt install python2 python2-dev python-is-python2 -y || true
          
          # تثبيت المكتبات الضرورية للبناء للـ 32 بت
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
          
          # تثبيت repo بشكل عالمي
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup TWRP 8.1 Source
        run: |
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrp@builder.com"
          git config --global user.name "Builder"
          # تغيير الـ Branch لـ 8.1 ليتوافق مع أندرويد أوريو وجهازك الـ 32 بت
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Sync Device Tree
        run: |
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device/lenovo/tb7104/* $DEVICE_PATH/ || true

      - name: 32-bit Compatibility & Python Fix
        run: |
          cd $HOME/twrp
          # تنظيف أي كود بايثون قديم عشان نتفادى الـ SyntaxError الملعونة
          find build/make/tools -name "*.py" -exec sed -i 's/print "\(.*\)"/print("\1")/g' {} + || true
          find build/make/tools -name "*.py" -exec sed -i 's/\.iteritems()/.items()/g' {} + || true
          
          # إجبار السيستم على استخدام بايثون 2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          # أهم سطرين لضمان إن البناء يمشي 32 بت بالمللي
          export TARGET_ARCH=arm
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB7104-32bit-SUCCESS
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
