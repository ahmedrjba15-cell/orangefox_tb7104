name: OrangeFox Build TB7104

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          mkdir -p /home/runner/bin && cp bin/repo /home/runner/bin/repo && chmod a+x /home/runner/bin/repo          
          sudo apt update
          sudo apt install software-properties-common -y
          sudo add-apt-repository "deb http://archive.ubuntu.com/ubuntu focal main universe"
          sudo apt update
          sudo apt install git aria2 python3-pip bc bison build-essential flex g++-multilib gcc-multilib libxml2-utils lzop zip zlib1g-dev libtinfo5 libncurses5 libtinfo6 libncurses6 -y         
          sudo apt install python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python         
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
      - name: Setup OrangeFox Source
        run: |
          rm -rf $HOME/orangefox
          mkdir -p $HOME/orangefox && cd $HOME/orangefox
          git config --global user.email "fox@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Extract Kernel & Prep Device Tree
        run: |
          DEVICE_PATH=$HOME/orangefox/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp $GITHUB_WORKSPACE/device/lenovo/tb7104/*.mk $DEVICE_PATH/
          cp $GITHUB_WORKSPACE/device/lenovo/tb7104/*.sh $DEVICE_PATH/
          cp $GITHUB_WORKSPACE/device/lenovo/tb7104/*.fstab $DEVICE_PATH/
          find $GITHUB_WORKSPACE/device/lenovo/tb7104 -name "*kernel*" -exec cp {} $DEVICE_PATH/ \;
          find $GITHUB_WORKSPACE/device/lenovo/tb7104 -name "boot.img" -exec cp {} $DEVICE_PATH/ \;

      - name: Build Recovery Image
        run: |
          cd $HOME/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)          
