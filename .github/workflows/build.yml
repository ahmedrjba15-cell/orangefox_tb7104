name: OrangeFox Build TB7104

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          # ضيف libtinfo5 في السطر اللي جاي
          sudo apt install git aria2 python3-pip bc bison build-essential flex g++-multilib gcc-multilib gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib32z1-dev libtinfo5 libncurses5 -y        
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup OrangeFox Source
        run: |
          mkdir ~/orangefox && cd ~/orangefox
          git config --global user.email "fox@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Extract Kernel & Prep Device Tree
        run: |
          mkdir -p ~/orangefox/device/lenovo/tb7104
          cp $GITHUB_WORKSPACE/*.mk ~/orangefox/device/lenovo/tb7104/
          cp $GITHUB_WORKSPACE/*.sh ~/orangefox/device/lenovo/tb7104/
          cp $GITHUB_WORKSPACE/*.fstab ~/orangefox/device/lenovo/tb7104/
          # الخدعة اللي حلت مشكلة الـ Ninja
          cp $GITHUB_WORKSPACE/boot.img ~/orangefox/device/lenovo/tb7104/boot.img || cp $GITHUB_WORKSPACE/kernel ~/orangefox/device/lenovo/tb7104/boot.img

      - name: Build Recovery Image
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)
          # تنفيذ فكرتك في تجميع النتائج
          mkdir -p $GITHUB_WORKSPACE/output
          find out/target/product/tb7104/ -maxdepth 1 -name "*.img" -exec cp {} $GITHUB_WORKSPACE/output/ \;
          find out/target/product/tb7104/ -maxdepth 1 -name "OrangeFox*.zip" -exec cp {} $GITHUB_WORKSPACE/output/ \;

      - name: Upload Finished Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-TB7104
          path: output/
          if-no-files-found: error          
