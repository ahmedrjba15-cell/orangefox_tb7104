name: Build TWRP Recovery Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tools & Repo Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gnupg gperf
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync TWRP 8.1 Source
      run: |
        mkdir ~/orangefox_tb7104
        cd ~/orangefox_tb7104
        git config --global user.name "ahmedrjba15-cell"
        git config --global user.email "ahmed@example.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Sync Your Device Tree
      run: |
        # 1. عمل الفولدر بالمسار الصحيح تماماً جوة السورس
        mkdir -p ~/orangefox_tb7104/device/lenovo/tb7104
        
        # 2. نسخ كل محتويات الـ Repo بتاعك مباشرة إلى مسار الجهاز
        cp -r $GITHUB_WORKSPACE/* ~/orangefox_tb7104/device/lenovo/tb7104/
        
        # التحقق من وجود الملفات في مكانها الصحيح
        ls -la ~/orangefox_tb7104/device/lenovo/tb7104/
        # التحقق النهائي من وجود الملفات كلها مع بعضها في نفس المجلد
        ls -la ~/orangefox_tb7104/device/lenovo/tb7104/

    - name: Build Recovery Image
      run: |
        cd ~/orangefox_tb7104
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # بناء البيئة والـ lunch
        source build/envsetup.sh
        lunch omni_tb7104-eng
        
        # أمر البناء الصافي للـ TWRP
        make recoveryimage -j$(nproc)
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-tb7104
        path: ~/twrp/out/target/product/tb7104/recovery.img
        
