name: TWRP Build TB7104 FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools & Fix Libraries
        run: |
          sudo apt update
          sudo apt install python3 python3-pip software-properties-common -y
          # تثبيت الحزم المتاحة فقط في Ubuntu 24.04
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
          
          # خدعة سحرية: ربط المكتبة رقم 6 لتقوم بدور رقم 5 اللي السورس بيدور عليها
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          
          # ربط بايثون 3 ليكون هو البايثون الأساسي
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup TWRP Source
        run: |
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrp@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Extract Kernel & Prep Device Tree
        run: |
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device/lenovo/tb7104/* $DEVICE_PATH/ || true

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          # تعيين المتغيرات المهمة للبناء
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB7104-Build
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
