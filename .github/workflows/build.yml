name: OrangeFox Build TB7104

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install git aria2 python3-pip bc bison build-essential flex g++-multilib gcc-multilib gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y

      - name: Setup OrangeFox Source
        run: |
          mkdir ~/orangefox && cd ~/orangefox
          git config --global user.email "fox@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Extract Kernel & Prep Device Tree
        run: |
          mkdir -p ~/orangefox/device/lenovo/tb7104
          # هنا بننقل الملفات اللي إنت عملتها للمكان الصح
          cp $GITHUB_WORKSPACE/*.mk ~/orangefox/device/lenovo/tb7104/
          cp $GITHUB_WORKSPACE/*.sh ~/orangefox/device/lenovo/tb7104/
          cp $GITHUB_WORKSPACE/*.fstab ~/orangefox/device/lenovo/tb7104/
          # تحميل أداة magiskboot لفك البوت إيمج لو احتجنا
          wget https://github.com/tiann/KernelSU/releases/download/v0.6.9/magiskboot -O magiskboot
          chmod +x magiskboot

      - name: Build Recovery Image
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Finished Recovery
        uses: actions/upload-artifact@v2
        with:
          name: OrangeFox-Lenovo-TB7104
          path: /home/runner/orangefox/out/target/product/tb7104/recovery.im
