name: Build TWRP Recovery Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Tools, Repo, Java 8 & Libs
      run: |
        sudo apt-get update
        # تثبيت الأدوات الأساسية، جاوا 8، ومكتبات التوافقية القديمة libncurses5
        sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gnupg gperf python2-minimal openjdk-8-jdk libncurses5 libncurses5:i386 libtinfo5
        
        # عمل روابط توافقية إضافية عشان نضمن إن الـ Compiler يلاقي المكتبة تحت أي اسم
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Checkout Device Tree Source (Temporary)
      uses: actions/checkout@v4
      with:
        path: temp_device_tree

    - name: Initialize and Sync TWRP 8.1 Source
      run: |
        git config --global user.name "ahmedrjba15-cell"
        git config --global user.email "ahmed@example.com"
        
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Setup Official Device Tree Path
      run: |
        rm -rf device/lenovo/tb7104
        mkdir -p device/lenovo/tb7104
        
        # نقل المجلد الداخلي المنظم
        cp -r temp_device_tree/device/lenovo/tb7104/* device/lenovo/tb7104/
        
        # نقل ملفات الـ Root الأساسية
        cp temp_device_tree/vendorsetup.sh device/lenovo/tb7104/ 2>/dev/null || true
        cp temp_device_tree/AndroidProducts.mk device/lenovo/tb7104/ 2>/dev/null || true
        
        # التأكد من تهيئة ملف المنتَج
        echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_tb7104.mk' > device/lenovo/tb7104/AndroidProducts.mk
        
        # تنظيف المؤقت
        rm -rf temp_device_tree
        
        echo "=== Verification: Checking Target Files ==="
        ls -la device/lenovo/tb7104/

    - name: Build Recovery Image
      run: |
        # 1. إجبار السيرفر على استخدام Java 8 الافتراضية للـ Build
        sudo update-java-alternatives --set java-1.8.0-openjdk-amd64 || true
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 2. تحويل البايثون الافتراضي لـ Python 2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        # 3. بدء البناء الصافي
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_tb7104-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-tb7104
        path: out/target/product/tb7104/recovery.img
        
