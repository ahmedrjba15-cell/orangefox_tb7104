name: Build TWRP Recovery Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Tools & Repo Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gnupg gperf
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync TWRP 8.1 Source
      run: |
        mkdir -p ~/orangefox_tb7104
        cd ~/orangefox_tb7104
        git config --global user.name "ahmedrjba15-cell"
        git config --global user.email "ahmed@example.com"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Checkout Your Device Tree Directly
      uses: actions/checkout@v4
      with:
        path: orangefox_tb7104/device/lenovo/tb7104

    - name: Verify Device Tree Files
      run: |
        echo "=== Checking target folder ==="
        ls -la ~/orangefox_tb7104/device/lenovo/tb7104/

    - name: Build Recovery Image
      run: |
        cd ~/orangefox_tb7104
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_tb7104-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-tb7104
        path: ~/orangefox_tb7104/out/target/product/tb7104/recovery.img
        
