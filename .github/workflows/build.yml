name: TWRP Build TB7104 FINAL-STRATEGY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools & Libraries
        run: |
          sudo apt update
          sudo apt install python3 python3-pip python3-2to3 software-properties-common -y
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
          
          # ربط المكتبات الأساسية (لحل مشكلة libtinfo.so.5)
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          
          # تثبيت أداة repo
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup TWRP Source
        run: |
          # مسح الفولدر القديم للبدء على نظافة تامة
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrp@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Sync Device Tree
        run: |
          # استخدام المسار اللي أنت نظمته في المستودع بتاعك
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device/lenovo/tb7104/* $DEVICE_PATH/ || true

      - name: Dual-Path Compatibility Fix (The Choice)
        run: |
          cd $HOME/twrp
          # الخيار الأول: تحويل الكود برمجياً ليتوافق مع بايثون 3 (عشان ميزعلش)
          # بنصلح الـ print والـ iteritems والـ stderr أوتوماتيكياً
          find . -name "*.py" -exec 2to3 -w -n {} + || true
          
          # الخيار الثاني: ربط بايثون ليكون متاحاً تحت أي اسم يطلبه السورس
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          # اختيار الديفايس وبدء ملحمة البناء
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB7104-IMAGE
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
