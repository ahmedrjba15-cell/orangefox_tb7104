name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3-2to3 gnupg gperf

    - name: Setup TWRP 8.1 Source
      run: |
        mkdir ~/orangefox
        cd ~/orangefox
        git config --global user.name "ahmedrjba15-cell"
        git config --global user.email "ahmed@example.com"
        # أمر تحميل السورس الأساسي لـ TWRP / OrangeFox الخاص بك يوضع هنا
        
    - name: Sync Device Tree
      run: |
        # نقل شجرة جهازك للمسار الصحيح داخل السورس
        mkdir -p ~/orangefox/device/lenovo/tb7104
        cp -r $GITHUB_WORKSPACE/* ~/orangefox/device/lenovo/tb7104/

    - name: Build Recovery Image
      run: |
        cd ~/orangefox
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_tb7104-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/artifacts-upload@v3
      with:
        name: OrangeFox-Recovery-tb7104
        path: ~/orangefox/out/target/product/tb7104/recovery.img
        
