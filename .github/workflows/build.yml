name: TWRP Build TB7104 FINAL-ULTIMATE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fundamental Build Tools
        run: |
          sudo apt update
          # تثبيت الأدوات الأساسية اللي السيرفر Noble بيقبلها دايماً
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 -y
          
          # تثبيت repo في مسار النظام العالمي
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
          # حل مشكلة ncurses اللي بتظهر في البناء للأجهزة القديمة
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Setup TWRP Source
        run: |
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrp@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Sync Device Tree
        run: |
          # استخدام المسار المنظم بتاعك لضمان وصول السيرفر للملفات
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device/lenovo/tb7104/* $DEVICE_PATH/ || true

      - name: GitHub-Standard Compatibility Patch
        run: |
          cd $HOME/twrp
          # استهداف ملفات الأدوات (build/make/tools) لأنها هي اللي بتضرب دايماً
          
          # 1. تصليح أقواس الـ print (التي تظهر كخطأ Syntax)
          find build/make/tools -name "*.py" -exec sed -i 's/print "\(.*\)"/print("\1")/g' {} + || true
          
          # 2. تصليح الـ iteritems الملعونة اللي وقفتنا عند 1555 ملف
          find build/make/tools -name "*.py" -exec sed -i 's/\.iteritems()/.items()/g' {} + || true
          
          # 3. جعل بايثون 3 يمثل دور بايثون 2 بالكامل لتغطية كل السيناريوهات
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB7104-ULTIMATE-SUCCESS
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
