name: TWRP Build TB7104 JAMMY-PRO-FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fundamental Build Tools
        run: |
          sudo apt update
          # تثبيت بايثون 2 ومكتباته الأساسية
          sudo apt install python2 python2-dev python-is-python2 -y || true
          
          # تثبيت بقية الأدوات (لاحظ استخدام libncurses5 المناسبة لـ 22.04)
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
          
          # توفير أداة repo عالمياً
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup TWRP Source
        run: |
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrp@builder.com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Sync Device Tree
        run: |
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device/lenovo/tb7104/* $DEVICE_PATH/ || true

      - name: Forced Python 2 Alias (The 100% Key)
        run: |
          # هذه الخطوة هي اللي هتحل خطأ الصورة 131307
          # بنجبر السيستم إن "python" و "python3" يشاوروا على نسخة 2.7 وقت البناء فقط
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo ln -sf /usr/bin/python2 /usr/bin/python3
          python --version

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_tb7104-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB7104-JAMMY-SUCCESS
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
