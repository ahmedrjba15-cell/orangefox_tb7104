name: TWRP Build TB7104-32BIT-FINAL-V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install python2 python2-dev python-is-python2 python-is-python3 -y || true
          sudo apt install git aria2 bc bison build-essential curl flex g++-multilib gcc-multilib gnuandg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup TWRP 8.1 Source
        run: |
          rm -rf $HOME/twrp
          mkdir -p $HOME/twrp && cd $HOME/twrp
          git config --global user.email "twrpbuilder@com"
          git config --global user.name "Builder"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Sync Device Tree
        run: |
          DEVICE_PATH=$HOME/twrp/device/lenovo/tb7104
          mkdir -p $DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/* $DEVICE_PATH/ || true

      - name: Forced Compatibility Fix
        run: |
          cd $HOME/twrp
          # الملعونة SyntaxError البايثون اللي بيقفل الـ Compile
          find build/make/tools -name "*.py" -exec sed -i 's/print "\(.*\)"/print("\1")/g' {} + || true
          find build/make/tools -name "*.py" -exec sed -i 's/\.iteritems()/\.items()/g' {} + || true

      - name: Build Recovery Image
        run: |
          cd $HOME/twrp
          # أسطر تصحيح المسارات للتوافق مع بايثون 2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          export TARGET_ARCH=arm
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_tb7104-eng
          make recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/artifact@v4
        with:
          name: TWRP-TB7104-32bit-SUCCESS
          path: /home/runner/twrp/out/target/product/tb7104/recovery.img
          
